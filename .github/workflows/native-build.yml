name: Build native SDK

on:
  workflow_call:
    inputs:
      profile:
        required: true
        type: string
      runner:
        required: true
        type: string
      host:
        required: true
        type: string
      triplet:
        required: true
        type: string
      preset:
        required: true
        type: string
      cnet_preset:
        required: true
        type: string
      android_abi:
        type: string
        default: ''

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  sdk:
    name: ${{ inputs.profile }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      SDK_PROFILE: ${{ inputs.profile }}
      SDK_TRIPLET: ${{ inputs.triplet }}
      SDK_PRESET: ${{ inputs.preset }}
      CNET_PRESET: ${{ inputs.cnet_preset }}
      SALTSCORE_ANDROID_ABI: ${{ inputs.android_abi }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read upstream pins
        run: |
          $inputs = ConvertFrom-StringData (Get-Content .env.example -Raw)
          foreach ($key in @('VCPKG_CACHE_VERSION', 'SALTS_CNET_REF')) {
            if (-not $inputs[$key]) { throw "Missing SDK pin $key" }
            "$key=$($inputs[$key])" >> $env:GITHUB_ENV
          }

      - uses: actions/checkout@v4
        with:
          repository: qigao/vcpkg-cache
          ref: v${{ env.VCPKG_CACHE_VERSION }}
          path: build/upstream/vcpkg-cache
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: qigao/salts-cnet
          ref: ${{ env.SALTS_CNET_REF }}
          path: build/upstream/salts-cnet
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore pinned SDKs and lexer generator
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_HOST: ${{ inputs.host }}
        run: |
          python cmake/ci/restore-native-sdk.py --profile $env:SDK_PROFILE --triplet $env:SDK_TRIPLET --host $env:SDK_HOST
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: ./build/upstream/vcpkg-cache/.github/actions/setup-llvm-mingw
        if: inputs.profile == 'windows-llvm-mingw-x64'
        id: llvm-mingw

      - name: Locate Visual Studio
        if: runner.os == 'Windows'
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$vs) { throw 'Visual Studio C++ tools are required' }
          "VSDEVCMD_BAT=$vs/Common7/Tools/VsDevCmd.bat" >> $env:GITHUB_ENV
          'VSDEVCMD_ARCH=x64' >> $env:GITHUB_ENV

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang ninja-build

      - uses: actions/download-artifact@v4
        if: inputs.android_abi != ''
        with:
          name: linux-x64-lemon
          path: build/host-tools

      - name: Build pinned CNet SDK and qualify SaltsNet
        env:
          LLVM_MINGW_ROOT: ${{ steps.llvm-mingw.outputs.root }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $root = (Get-Location).Path.Replace('\', '/')
          $source = "$root/build/upstream/salts-cnet"
          $stage = "$root/build/$env:SDK_PRESET/stage"
          $archiveDirectory = "$root/build/archives"
          $cnet = "$root/build/upstream/$env:SDK_PROFILE/cnet"
          $wrapper = "$source/cmake/WithVs.cmd"
          if ($env:LLVM_MINGW_ROOT) { $env:LLVM_MINGW_ROOT = $env:LLVM_MINGW_ROOT.Replace('\', '/') }
          function Invoke-NativeTool([string]$tool, [string[]]$arguments) {
            if ($IsWindows) { & $wrapper $tool @arguments }
            else { & $tool @arguments }
          }

          $env:VCPKG_TARGET_TRIPLET = $env:SDK_TRIPLET
          $env:LLVM_NATIVE_TARGET_TRIPLET = $env:SDK_TRIPLET
          $env:MSVC_TARGET_TRIPLET = $env:SDK_TRIPLET
          $env:ANDROID_TARGET_TRIPLET = $env:SDK_TRIPLET
          $env:INSTALL_PREFIX = $cnet
          $env:LLVM_NATIVE_INSTALL_PREFIX = $cnet
          $env:MSVC_INSTALL_PREFIX = $cnet
          $env:ANDROID_INSTALL_PREFIX = $cnet
          $env:LLVM_MINGW_TARGET = 'x86_64-w64-mingw32'
          Push-Location $source
          try {
            Invoke-NativeTool cmake @('--preset', $env:CNET_PRESET, '-DBUILD_TESTS=OFF')
            Invoke-NativeTool cmake @('--build', '--preset', $env:CNET_PRESET, '--parallel', '3')
            Invoke-NativeTool cmake @('--build', '--preset', "install-$env:CNET_PRESET")
          } finally { Pop-Location }

          $env:SALTS_CNET_ROOT = $cnet
          $cross = -not [string]::IsNullOrWhiteSpace($env:SALTSCORE_ANDROID_ABI)
          $options = @('--preset', $env:SDK_PRESET)
          if ($cross) {
            tar xf build/host-tools/lemon.tar -C build/host-tools
            $options += @('-DBUILD_TESTING=OFF', "-DLEMON_EXECUTABLE=$root/build/host-tools/lemon")
          } else {
            $options += '-DBUILD_TESTING=ON'
          }
          Invoke-NativeTool cmake $options
          Invoke-NativeTool cmake @('--build', '--preset', $env:SDK_PRESET, '--parallel', '3')
          if (-not $cross) {
            Invoke-NativeTool ctest @('--preset', $env:SDK_PRESET, '--timeout', '180', '--parallel', '2')
          }
          Invoke-NativeTool cmake @('--build', '--preset', "install-$env:SDK_PRESET")
          if (-not $cross) {
            $consumerPreset = switch ($env:SDK_PROFILE) {
              'windows-llvm-mingw-x64' { 'native-release-user' }
              'windows-msvc-x64' { 'win-release-user' }
              'macos-clang-arm64' { 'macos-release-user' }
              default { 'llvm-release-user' }
            }
            Invoke-NativeTool pwsh @('-NoProfile', '-File', 'cmake/ci/verify-installed-sdk.ps1',
              '-Preset', $consumerPreset, '-SaltsNetRoot', $stage, '-TargetTriplet', $env:SDK_TRIPLET)
          } else {
            $readelf = Join-Path $env:ANDROID_NDK_HOME 'toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf'
            $libraries = Get-ChildItem -LiteralPath "$stage/lib" -Filter '*.so' -File
            if (!$libraries) { throw 'No Android shared libraries were installed' }
            foreach ($library in $libraries) {
              $segments = & $readelf --program-headers --wide $library.FullName | Select-String '^\s*LOAD\s+.+\s0x([0-9a-fA-F]+)\s*$'
              if (!$segments) { throw "No LOAD segments in $($library.Name)" }
              foreach ($segment in $segments) {
                if ([Convert]::ToInt32($segment.Matches[0].Groups[1].Value, 16) -lt 16384) {
                  throw "Unaligned ELF LOAD segment in $($library.Name)"
                }
              }
            }
          }

          New-Item -ItemType Directory -Path "$stage/dependencies" | Out-Null
          Copy-Item -Recurse -LiteralPath $cnet -Destination "$stage/dependencies/salts-cnet"
          foreach ($license in @('LICENSE', 'NOTICE', 'THIRD_PARTY_NOTICES.md')) {
            if (Test-Path -LiteralPath $license -PathType Leaf) { Copy-Item -LiteralPath $license -Destination $stage }
          }
          $version = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'version-semver'
          @{
            version = $version; commit = $env:GITHUB_SHA; profile = $env:SDK_PROFILE
            triplet = $env:SDK_TRIPLET; native_tests = -not $cross
            dependencies = (Get-Content $env:SALTSNET_INPUTS -Raw | ConvertFrom-Json)
            cnet = @{version=$env:SALTS_CNET_VERSION; commit=$env:SALTS_CNET_REF; root='dependencies/salts-cnet'}
          } | ConvertTo-Json -Depth 6 | Set-Content "$stage/saltsnet-sdk-manifest.json" -Encoding utf8
          New-Item -ItemType Directory -Path $archiveDirectory | Out-Null
          tar cf "$archiveDirectory/salts-netutils-$version-$env:SDK_PROFILE.tar" -C $stage .
          if ($env:SDK_PROFILE -eq 'linux-clang-x64') {
            tar cf "$archiveDirectory/lemon.tar" -C "$root/build/$env:SDK_PRESET/bin" lemon
          }

      - uses: actions/upload-artifact@v4
        with:
          name: salts-netutils-sdk-${{ inputs.profile }}
          path: build/archives/salts-netutils-*.tar
          compression-level: 0
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: inputs.profile == 'linux-clang-x64'
        with:
          name: linux-x64-lemon
          path: build/archives/lemon.tar
          if-no-files-found: error
