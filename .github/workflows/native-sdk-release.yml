name: Qualify native SDK release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.env.example'
      - '.github/workflows/native*.yml'
      - 'cmake/**'
      - 'presets/**'
      - '**/*.c'
      - '**/*.h'
      - '**/CMakeLists.txt'

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {profile: windows-llvm-mingw-x64, runner: windows-2025, host: windows-x64, triplet: qigao-x64-windows-llvm-mingw, preset: native-release-user, cnet_preset: native-release-user}
          - {profile: windows-msvc-x64, runner: windows-2025, host: windows-x64, triplet: x64-windows, preset: msvc-release-user, cnet_preset: msvc-release-user}
          - {profile: linux-clang-x64, runner: ubuntu-24.04, host: linux-x64, triplet: x64-linux, preset: llvm-native-release-user, cnet_preset: llvm-native-release-user}
          - {profile: linux-clang-arm64, runner: ubuntu-24.04-arm, host: linux-arm64, triplet: arm64-linux, preset: llvm-native-release-user, cnet_preset: llvm-native-release-user}
          - {profile: macos-clang-arm64, runner: macos-15, host: macos-arm64, triplet: arm64-osx, preset: llvm-native-release-user, cnet_preset: llvm-native-release-user}
    uses: ./.github/workflows/native-build.yml
    with:
      profile: ${{ matrix.profile }}
      runner: ${{ matrix.runner }}
      host: ${{ matrix.host }}
      triplet: ${{ matrix.triplet }}
      preset: ${{ matrix.preset }}
      cnet_preset: ${{ matrix.cnet_preset }}

  android:
    needs: native
    strategy:
      fail-fast: false
      matrix:
        include:
          - {profile: android-arm64, abi: arm64-v8a, triplet: arm64-android, preset: android-arm64-release-user}
          - {profile: android-x64, abi: x86_64, triplet: x64-android, preset: android-x64-release-user}
    uses: ./.github/workflows/native-build.yml
    with:
      profile: ${{ matrix.profile }}
      runner: ubuntu-24.04
      host: linux-x64
      triplet: ${{ matrix.triplet }}
      preset: ${{ matrix.preset }}
      cnet_preset: android-release-user
      android_abi: ${{ matrix.abi }}
